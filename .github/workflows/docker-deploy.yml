name: Docker Deploy to GHCR (interactive & standard)

on:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' docshub/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push interactive image
        uses: docker/build-push-action@v5
        with:
          context: ./docshub
          file: ./docshub/Dockerfile.interactive
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docshub:interactive
            ghcr.io/${{ github.repository_owner }}/docshub:${{ steps.get_version.outputs.version }}-interactive

      - name: Build and push standard image
        uses: docker/build-push-action@v5
        with:
          context: ./docshub
          file: ./docshub/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docshub:latest
            ghcr.io/${{ github.repository_owner }}/docshub:${{ steps.get_version.outputs.version }}
