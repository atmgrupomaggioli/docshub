name: 🧑‍🚀 Check

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  vitest:
    runs-on: ubuntu-latest
    name: 📦 Build Docshub
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          working-directory: ./docshub

      - name: Install dependencies
        run: npm install
        working-directory: ./docshub

      - name: Check errors with Astro Check
        run: npm run check
        working-directory: ./docshub

      - name: Build Docshub App
        run: npm run build
        working-directory: ./docshub
